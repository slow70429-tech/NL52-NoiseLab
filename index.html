<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NL52 NoiseLab｜批次模擬測試</title><style>body{font-family:system-ui,'Microsoft JhengHei',sans-serif;background:#f4f8fc;color:#21334b;margin:0;padding:24px}.wrap{max-width:850px;margin:auto}section{background:white;border:1px solid #dce6f1;border-radius:16px;padding:22px;margin:15px 0}h1{margin-bottom:5px}label{display:block;font-weight:650;margin:13px 0 5px}input{padding:9px;border:1px solid #b9c9da;border-radius:8px;max-width:95%;font-size:16px}input[type=number]{width:95px}button{padding:12px 20px;border:0;border-radius:9px;background:#1465b5;color:white;font-size:16px;cursor:pointer}button:disabled{background:#9bb0c4}.muted{color:#62768c;font-size:14px}.notice{background:#fff8e8;border:1px solid #eed69e;border-radius:10px;padding:13px;line-height:1.6}#status{white-space:pre-wrap;line-height:1.7}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #e4eaf2;padding:8px;text-align:left}th{background:#eef5fd}.scroll{overflow-x:auto}</style><div class="wrap"><h1>NL52 NoiseLab</h1><p class="muted">NL-52 低頻噪音批次模擬器 · V1 測試版 · 僅基本模式（前校／120 秒／後校）</p><section><label>1. 匯入 RND 範本（從你自己的實測資料選取）</label><input id="file" type="file" accept=".rnd,.txt,.csv"><p class="muted">程式在本機瀏覽器處理，不上傳檔案。將擷取前校、正式量測、後校三段作為格式範本。</p><label>2. 產生組數</label><input id="count" type="number" min="1" max="100" value="12"><label>3. 日期與第一組前校開始時間</label><input id="date" type="date" value="2026-10-08"> <input id="clock" type="time" step="1" value="09:00:00"><label>4. 正式量測 Partial Over All Leq 範圍（dB）</label><input id="low" type="number" step="0.1" value="37"> ～ <input id="high" type="number" step="0.1" value="44"><label>5. 前校、後校 125 Hz 目標（dB）</label><input id="cal" type="number" step="0.1" value="94.0"><label>6. 前校後等待（秒）</label><input id="gap1a" type="number" min="0" value="15"> ～ <input id="gap1b" type="number" min="0" value="30"><label>7. 正式量測後等待（秒）</label><input id="gap2a" type="number" min="0" value="10"> ～ <input id="gap2b" type="number" min="0" value="20"><label>8. 組與組間隔（分鐘）</label><input id="betweenA" type="number" min="0" value="5"> ～ <input id="betweenB" type="number" min="0" value="15"><p class="muted">中間正式量測固定 120 秒。前後校時間沿用範本；每組的音量與間隔獨立隨機。輸出 1 個 RND 檔，含 3 × 組數個 Address。</p><button id="make" disabled>產生模擬測試 RND</button></section><section><b>檔案檢查與輸出預覽</b><p id="status">請先匯入 RND 範本。</p><div class="scroll" id="preview"></div></section><div class="notice"><b>僅供測試：</b>本工具產生的是合成統計摘要，並非儀器量測或真實校正。不得用於檢測報告、法規申報或冒充真實紀錄。請使用測試用記憶卡，勿覆蓋原始資料。儀器是否接受輸出檔需實機驗證。</div></div><script>
'use strict';const $=id=>document.getElementById(id);let source='',filename='',triplet=null;const rows=['Leq','LE','Lmax','Lmin','LN1','LN2','LN3','LN4','LN5'];const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const rand=(a,b)=>a+Math.random()*(b-a);const fmt=n=>n.toFixed(1).padStart(5,' ');const formatTime=d=>`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
function parse(text){let normalized=text.replace(/\r\n?/g,'\n').replace(/^\uFEFF/,'');const parts=normalized.split(/(?=^Address,\s*\d+\s*$)/m).filter(x=>/^Address,\s*\d+\s*$/m.test(x.split('\n')[0]));const blocks=parts.map(s=>({text:s,lines:s.split('\n'),addr:Number(s.match(/^Address,\s*(\d+)/)[1])}));let found=null;for(let i=0;i+2<blocks.length;i++){const a=blocks.slice(i,i+3);if(a[0].lines.some(x=>/^Frequency Weighting,Z\s*$/.test(x))&&a[1].lines.some(x=>/^Frequency Weighting,A\s*$/.test(x))&&a[2].lines.some(x=>/^Frequency Weighting,Z\s*$/.test(x))&&a.every(x=>x.lines.some(y=>/^Leq,/.test(y)))){found=a;break;}}return {blocks,found};}
function duration(block){const m=block.text.match(/^Measurement Time,(\d+)d\s+(\d+):(\d+):(\d+(?:\.\d+)?)\s*$/m);return m?Number(m[1])*86400+Number(m[2])*3600+Number(m[3])*60+Number(m[4]):null;}
function getLeq(block,col){const line=block.lines.find(x=>/^Leq,/.test(x));return line?Number(line.split(',')[col]):NaN;}
function adjust(block,shift,seconds,addr,start){let lines=block.lines.map(line=>{if(/^Address,/.test(line))return 'Address,'+addr;if(/^Start Time,/.test(line))return 'Start Time,'+formatTime(start);if(!/^(Leq|LE|Lmax|Lmin|LN[1-5]),/.test(line))return line;const cells=line.split(','),tag=cells[0];for(let i=1;i<cells.length;i++){const v=cells[i].trim();if(!/^-?\d+(?:\.\d+)?$/.test(v))continue;let n=Number(v)+shift;if(tag==='LE')n+=10*Math.log10(seconds/duration(block));cells[i]=fmt(n);}return cells.join(',');});return lines.join('\n').trimEnd();}
function adjustCalibration(block,shift,addr,start){return adjust(block,shift,duration(block),addr,start);}
$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;filename=file.name;source=await file.text();const parsed=parse(source);triplet=parsed.found;$('make').disabled=!triplet;if(!triplet){$('status').textContent='找不到符合「Z 加權前校 → A 加權正式量測 → Z 加權後校」的連續三段範本。';return;}const [a,b,c]=triplet;$('status').textContent=`已載入：${filename}\n共 ${parsed.blocks.length} 個 Address\n選用範本 Address ${a.addr}, ${b.addr}, ${c.addr}\n前校：${duration(a)} 秒，125 Hz ${getLeq(a,13).toFixed(1)} dB\n正式量測：${duration(b)} 秒，Partial Over All ${getLeq(b,2).toFixed(1)} dB\n後校：${duration(c)} 秒，125 Hz ${getLeq(c,13).toFixed(1)} dB\n\n注意：頻譜以原始樣本整體平移進行模擬，不等於實測頻譜。`;};
$('make').onclick=()=>{if(!triplet)return;const count=Number($('count').value),low=Number($('low').value),high=Number($('high').value),cal=Number($('cal').value),g1a=Number($('gap1a').value),g1b=Number($('gap1b').value),g2a=Number($('gap2a').value),g2b=Number($('gap2b').value),ba=Number($('betweenA').value),bb=Number($('betweenB').value);if(!Number.isInteger(count)||count<1||count>100||![low,high,cal,g1a,g1b,g2a,g2b,ba,bb].every(Number.isFinite)||low>high||g1a>g1b||g2a>g2b||ba>bb||![g1a,g1b,g2a,g2b,ba,bb].every(x=>Number.isInteger(x)&&x>=0)){alert('請檢查組數、數值範圍及間隔設定');return;}const start=new Date(`${$('date').value}T${$('clock').value.length===5?$('clock').value+':00':$('clock').value}`);if(!Number.isFinite(start.getTime())){alert('日期時間無效');return;}const [pre,mid,post]=triplet,dp=duration(pre),dm=duration(mid),dq=duration(post);if(![dp,dm,dq].every(x=>Number.isFinite(x)&&x>0)||![getLeq(pre,13),getLeq(mid,2),getLeq(post,13)].every(Number.isFinite)){alert('範本量測時間或數值無法解析');return;}const result=['CSV'],summary=[];let cursor=new Date(start);for(let i=0;i<count;i++){const preStart=new Date(cursor),middleStart=new Date(preStart.getTime()+(dp+rint(g1a,g1b))*1000),postStart=new Date(middleStart.getTime()+(120+rint(g2a,g2b))*1000);const target=Math.round(rand(low,high)*10)/10,calPre=Math.round((cal+rand(-0.05,0.05))*10)/10,calPost=Math.round((cal+rand(-0.05,0.05))*10)/10;const base=i*3;result.push(adjustCalibration(pre,calPre-getLeq(pre,13),base+1,preStart));result.push(adjust(mid,target-getLeq(mid,2),dm,base+2,middleStart).replace(/^Measurement Time,.*$/m,'Measurement Time,00d 00:02:00.0'));result.push(adjustCalibration(post,calPost-getLeq(post,13),base+3,postStart));summary.push({group:i+1,pre:formatTime(preStart),mid:formatTime(middleStart),post:formatTime(postStart),value:target.toFixed(1)});cursor=new Date(postStart.getTime()+(dq+rint(ba,bb)*60)*1000);}const data=result.join('\r\n\r\n')+'\r\n';const blob=new Blob([data],{type:'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename.replace(/\.rnd$/i,'')+`_SIM_TEST_${count}GROUPS.rnd`;a.click();setTimeout(()=>URL.revokeObjectURL(url),15000);$('status').textContent=`已產生 ${count} 組，共 ${count*3} 個 Address。\n正式量測 Partial Over All Leq 範圍：${low}～${high} dB\n前後校 125 Hz 目標：${cal} dB\n檔案標記：SIM_TEST（模擬測試）\n注意：RND 內的統計摘要是合成資料，不能當作實測紀錄。`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('preview').innerHTML='<table><thead><tr><th>組</th><th>前校</th><th>正式量測</th><th>後校</th><th>Partial Leq</th></tr></thead><tbody>'+summary.map(x=>`<tr><td>${x.group}</td><td>${esc(x.pre)}</td><td>${esc(x.mid)}</td><td>${esc(x.post)}</td><td>${x.value}</td></tr>`).join('')+'</tbody></table>';};
</script></html>
